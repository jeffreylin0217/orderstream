[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orderstream"
version = "0.1.0"
description = "Order lifecycle streaming and daily reconciliation"
requires-python = ">=3.11,<3.13"
dependencies = ["pyspark==3.5.8", "delta-spark==3.3.2", "kafka-python==2.2.15", "jsonschema==4.25.1", "rfc3339-validator==0.1.4"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[tool.setuptools.packages.find]
include = ["producer*", "streaming*", "reconciliation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires Java, Spark and Kafka"]

[tool.ruff]
line-length = 100
